name: carepaw
description: "Smart Veterinary Patient Management System"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Routing
  go_router: ^17.5.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0

  # Security
  pointycastle: ^4.0.0
  local_auth: ^3.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+6
  firebase_functions: ^0.6.0
  # firebase_storage: ^12.3.4  // Replaced with local file storage (free, no cloud costs)

  # Background Work & Connectivity
  workmanager: ^0.10.9
  connectivity_plus: ^6.0.5

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  logger: ^2.5.0
  drift: ^2.34.3
  path_provider: ^2.1.6
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  path: ^1.9.1
  sqlite3: ^3.5.1
  flutter_animate: ^4.5.0
  permission_handler: ^12.0.1
  crypto: ^3.0.5

  # Local Notifications (free alternative to FCM)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  device_preview: ^3.0.0-prerelease3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  injectable_generator: ^3.1.3

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true